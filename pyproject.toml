[project]
name = "diabetes-diary"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pwdlib[argon2]>=0.2,<1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["diary"]
strict = true
